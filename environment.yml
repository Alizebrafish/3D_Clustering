name: f3dca_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - tk
  - numpy
  - pandas
  - openpyxl          # Required by pandas to read .xlsx Excel files
  - scipy
  - scikit-learn
  - matplotlib
  - pillow            # PIL library for image display in Tkinter
  - numba             # Optional dependency referenced in script
  - pip
  - pip:
      - tensorflow==2.15.0   # Standard, stable Keras/TF version for Conv1D/Dense layers